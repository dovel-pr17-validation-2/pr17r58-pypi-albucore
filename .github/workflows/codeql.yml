name: CodeQL

on:
  push:
    branches: [main, master]
    paths-ignore:
      - AGENTS.md
      - CONTRIBUTING.md
      - MAINTAINERS.md
      - README.md
      - SECURITY.md
      - docs/**
  pull_request:
    branches: [main, master]
    paths-ignore:
      - AGENTS.md
      - CONTRIBUTING.md
      - MAINTAINERS.md
      - README.md
      - SECURITY.md
      - docs/**
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Advanced analysis is opt-in; GitHub's default setup remains authoritative otherwise.
    if: vars.CODEQL_ADVANCED_SETUP == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      - name: Analyze code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
